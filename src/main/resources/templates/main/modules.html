<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Информационно-справочная система онлайн-школы</title>
    <header th:replace="index::head"></header>
</head>

<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Информационно-справочная система онлайн-школы</h1>
    <h2 class="text-center mb-4">Модули</h2>

    <div th:replace="index::navbar"></div>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Общее количество модулей</h5>
                    <p class="card-text" th:text="${moduleCount}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card">
                <div class="card-body">
                    <h5 class="text-center mb-4">Количество модулей по курсам</h5>
                    <canvas id="modulesChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-8 offset-md-2">
            <h3 class="mb-3">Поиск модуля по любому критерию:</h3>
            <form th:action="@{/main/modules}" method="get" class="bg-light p-4 rounded shadow-sm">
                <div class="row align-items-end">
                    <div class="col-md-8">
                        <label for="keyword" class="form-label">Ключевое слово:</label>
                        <div class="input-group">
                            <input type="text" name="keyword" id="keyword" class="form-control"
                                   th:value="${keyword}" placeholder="Введите для поиска"/>
                        </div>
                    </div>

                    <div class="col-md-4 d-flex gap-2 ps-md-3">
                        <button type="submit" class="btn btn-primary flex-grow-1">
                            Отправить
                        </button>
                        <button type="button" class="btn btn-outline-secondary flex-grow-1" onclick="clearSearch()">
                            Очистить
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <table id="moduleTable" class="table table-striped table-hover">
        <thead>
        <tr>
            <th scope="col">ID модуля</th>
            <th scope="col">Курс</th>
            <th scope="col">Название модуля</th>
            <th scope="col">Описание модуля</th>
            <div sec:authorize="hasRole('ADMIN')">
                <th scope="col">Действия</th>
            </div>
        </tr>
        </thead>
        <tbody>
        <tr th:each="module: ${moduleList}">
            <td th:text="${module.id}"></td>
            <td th:text="${module.course.title}"></td>
            <td th:text="${module.moduleTitle}"></td>
            <td th:text="${module.moduleDescription}"></td>
            <div sec:authorize="hasRole('ADMIN')">
                <td>
                    <div class="d-flex gap-2">
                        <a th:href="@{'/delete/delete_module/' + ${module.id}}" class="btn btn-danger btn-sm">Удалить</a>
                        <a th:href="@{'/edit/edit_module/' + ${module.id}}" class="btn btn-primary btn-sm ms-2">Редактировать</a>
                    </div>
                </td>
            </div>
        </tr>
        </tbody>
    </table>

    <div sec:authorize="hasRole('ADMIN')">
        <div class="text-center mt-4">
            <a href="/new/new_module" class="btn btn-primary">Добавить модуль</a>
        </div>
    </div>
</div>

<footer th:replace="index::footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
<script type="text/javascript">
    function clearSearch() {
        window.location = "[[@{/main/modules}]]"
    }
    $(document).ready(function () {
        $('#moduleTable').DataTable({
            "searching": false,
            "language": {
                "url": 'https://cdn.datatables.net/plug-ins/1.13.1/i18n/ru.json'
            }
        });
    });
</script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        // Получаем данные из модели
        const modulesPerCourseJson = /*[[${modulesPerCourseJson}]]*/ null;
        const modulesPerCourse = JSON.parse(modulesPerCourseJson);

        console.log("Данные из модели (JSON):", modulesPerCourseJson);
        console.log("Данные из модели (Parsed):", modulesPerCourse);

        // Подготавливаем данные для диаграммы
        const labels = Object.keys(modulesPerCourse);
        const data = Object.values(modulesPerCourse);

        // console.log("Названия курсов:", labels); // Проверка названий курсов
        // console.log("Количество модулей:", data); // Проверка количества модулей

        // Создаем диаграмму
        const ctx = document.getElementById('modulesChart').getContext('2d');
        const modulesChart = new Chart(ctx, {
            type: 'bar', // Тип диаграммы (столбчатая)
            data: {
                labels: labels, // Названия курсов
                datasets: [{
                    label: 'Количество модулей',
                    data: data, // Количество модулей
                    backgroundColor: 'rgba(54, 162, 235, 0.2)', // Цвет столбцов
                    borderColor: 'rgba(54, 162, 235, 1)', // Цвет границ
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true // Начинать ось Y с нуля
                    }
                }
            }
        });
    });
</script>
</body>
</html>
