<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Информационно-справочная система онлайн-школы</title>
    <header th:replace="index::head"></header>
</head>

<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Информационно-справочная система онлайн-школы</h1>
    <h2 class="text-center mb-4">Уроки</h2>

    <div th:replace="index::navbar"></div>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Общее количество уроков</h5>
                    <p class="card-text" th:text="${lessonCount}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card">
                <div class="card-body">
                    <h5 class="text-center mb-4">Количество уроков по модулям</h5>
                    <canvas id="lessonsChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-8 offset-md-2">
            <h3 class="mb-3">Поиск урока по любому критерию:</h3>
            <form th:action="@{/main/lessons}" method="get" class="bg-light p-4 rounded shadow-sm">
                <div class="row align-items-end">
                    <div class="col-md-8">
                        <label for="keyword" class="form-label">Ключевое слово:</label>
                        <div class="input-group">
                            <input type="text" name="keyword" id="keyword" class="form-control"
                                   th:value="${keyword}" placeholder="Введите для поиска"/>
                        </div>
                    </div>

                    <div class="col-md-4 d-flex gap-2 ps-md-3">
                        <button type="submit" class="btn btn-primary flex-grow-1">
                            Отправить
                        </button>
                        <button type="button" class="btn btn-outline-secondary flex-grow-1" onclick="clearSearch()">
                            Очистить
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <table id="lessonTable" class="table table-striped table-hover">
        <thead>
        <tr>
            <th scope="col">ID урока</th>
            <th scope="col">Модуль</th>
            <th scope="col">Название урока</th>
            <th scope="col">Описание урока</th>
            <div sec:authorize="hasRole('ADMIN')">
                <th scope="col">Действия</th>
            </div>
        </tr>
        </thead>
        <tbody>
        <tr th:each="lesson: ${lessonList}">
            <td th:text="${lesson.id}"></td>
            <td th:text="${lesson.module.moduleTitle}"></td>
            <td th:text="${lesson.lessonTitle}"></td>
            <td th:text="${lesson.lessonDescription}"></td>
            <div sec:authorize="hasRole('ADMIN')">
                <td>
                    <div class="d-flex gap-2">
                        <a th:href="@{'/delete/delete_lesson/' + ${lesson.id}}" class="btn btn-danger btn-sm">Удалить</a>
                        <a th:href="@{'/edit/edit_lesson/' + ${lesson.id}}" class="btn btn-primary btn-sm ms-2">Редактировать</a>
                    </div>
                </td>
            </div>
        </tr>
        </tbody>
    </table>

    <div sec:authorize="hasRole('ADMIN')">
        <div class="text-center mt-4">
            <a href="/new/new_lesson" class="btn btn-primary">Добавить урок</a>
        </div>
    </div>
</div>

<footer th:replace="index::footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
<script type="text/javascript">
    function clearSearch() {
        window.location = "[[@{/main/lessons}]]"
    }
    $(document).ready(function () {
        $('#lessonTable').DataTable({
            "searching": false,
            "language": {
                "url": 'https://cdn.datatables.net/plug-ins/1.13.1/i18n/ru.json'
            }
        });
    });
</script>
<script th:inline="javascript">
    /*<![CDATA[*/
    // Скрипт для диаграммы
    document.addEventListener("DOMContentLoaded", function () {
        // Получаем данные из модели
        const lessonsPerCourseJson = /*[[${lessonsPerModuleJson}]]*/ null;
        const lessonsPerCourse = JSON.parse(lessonsPerCourseJson);

        console.log("Данные из модели (JSON):", lessonsPerCourseJson);
        console.log("Данные из модели (Parsed):", lessonsPerCourse);

        // Подготавливаем данные для диаграммы
        const labels = Object.keys(lessonsPerCourse);
        const data = Object.values(lessonsPerCourse);

        console.log("Названия курсов:", labels);
        console.log("Количество уроков:", data);

        // Создаем диаграмму
        const ctx = document.getElementById('lessonsChart').getContext('2d');
        const lessonsChart = new Chart(ctx, {
            type: 'line', // Тип диаграммы (линейная)
            data: {
                labels: labels, // Названия курсов
                datasets: [{
                    label: 'Количество уроков',
                    data: data, // Количество уроков
                    backgroundColor: 'rgba(54, 162, 235, 0.2)', // Цвет столбцов
                    borderColor: 'rgba(54, 162, 235, 1)', // Цвет границ
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true // Начинать ось Y с нуля
                    }
                }
            }
        });
    });
</script>
</body>
</html>
