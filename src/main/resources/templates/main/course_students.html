<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Информационно-справочная система онлайн-школы</title>
  <header th:replace="index::head"></header>
</head>

<body>
<div class="container mt-5">
  <h1 class="text-center mb-4">Информационно-справочная система онлайн-школы</h1>
  <h2 class="text-center mb-4">Курсы-Ученики</h2>

  <div th:replace="index::navbar"></div>

  <div class="row mb-4">
    <div class="col-md-3">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Общее количество записей</h5>
          <p class="card-text" th:text="${CourseStudentsCount}"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-md-8 offset-md-2">
      <h3 class="mb-3">Поиск по любому критерию:</h3>
      <form th:action="@{/main/course_students}" method="get" class="bg-light p-4 rounded shadow-sm">
        <div class="row align-items-end">
          <div class="col-md-8">
            <label for="keyword" class="form-label">Ключевое слово:</label>
            <div class="input-group">
              <input type="text" name="keyword" id="keyword" class="form-control"
                     th:value="${keyword}" placeholder="Введите для поиска"/>
            </div>
          </div>

          <div class="col-md-4 d-flex gap-2 ps-md-3">
            <button type="submit" class="btn btn-primary flex-grow-1">
              Отправить
            </button>
            <button type="button" class="btn btn-outline-secondary flex-grow-1" onclick="clearSearch()">
              Очистить
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <table id="studentTable" class="table table-striped table-hover">
    <thead>
    <tr>
      <th scope="col">ID записи</th>
      <th scope="col">Курс</th>
      <th scope="col">Ученик</th>
      <th scope="col">Статус оплаты</th>
      <th scope="col">Статус прохождения</th>
      <th scope="col">Информация о сертификате</th>
      <div sec:authorize="hasRole('ADMIN')">
        <th scope="col">Действия</th>
      </div>
    </tr>
    </thead>
    <tbody>
    <tr th:each="courseStudent: ${courseStudentsList}">
      <td th:text="${courseStudent.id}"></td>
      <td th:text="${courseStudent.course.title}"></td>
      <td th:text="${courseStudent.student.firstName + ' ' + courseStudent.student.lastName}"></td>
      <td th:text="${courseStudent.paymentStatus}"></td>
      <td th:text="${courseStudent.courseCompletionStatus}"></td>
      <td th:text="${courseStudent.certificateInfo}"></td>
      <div sec:authorize="hasRole('ADMIN')">
        <td>
          <div class="d-flex gap-2">
            <a th:href="@{'/delete/delete_course_student/' + ${courseStudent.id}}" class="btn btn-danger btn-sm">Удалить</a>
            <a th:href="@{'/edit/edit_course_student/' + ${courseStudent.id}}" class="btn btn-primary btn-sm ms-2">Редактировать</a>
          </div>
        </td>
      </div>
    </tr>
    </tbody>
  </table>

  <div sec:authorize="hasRole('ADMIN')">
    <div class="text-center mt-4">
      <a href="/new/new_course_student" class="btn btn-primary">Добавить запись</a>
    </div>
  </div>
</div>

<footer th:replace="index::footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
<script type="text/javascript">
  function clearSearch() {
    window.location = "[[@{/main/students}]]"
  }
  $(document).ready(function () {
    $('#studentTable').DataTable({
      "searching": false,
      "language": {
        "url": 'https://cdn.datatables.net/plug-ins/1.13.1/i18n/ru.json'
      }
    });
  });
</script>
</body>
</html>
