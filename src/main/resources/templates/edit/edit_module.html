<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Информационно-справочная система онлайн-школы</title>
  <header th:replace="index::head"></header>
</head>

<body>
<div class="container mt-5">
  <h1 class="text-center mb-4">Информационно-справочная система онлайн-школы</h1>
  <h2 class="text-center mb-4">Модули</h2>

  <div th:replace="index::navbar"></div>

  <div class="row">
    <div class="col-md-8 offset-md-2">
      <form th:action="@{/save/save_module}" th:object="${module}" method="post" class="card p-4">
        <h3 class="mb-4">Редактировать модуль</h3>
        <div class="mb-3">
          <label for="id" class="form-label">ID модуля</label>
          <input type="number" th:field="*{id}" class="form-control" id="id" readonly="readonly" required>
        </div>
        <div class="mb-3">
          <label for="course" class="form-label">Курс</label>
          <select th:field="*{course.id}" class="form-control" id="course" required>
            <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.title}"></option>
          </select>
        </div>
        <div class="mb-3">
          <label for="title" class="form-label">Название модуля</label>
          <input type="text" th:field="*{moduleTitle}" class="form-control" id="title" required>
        </div>
        <div class="mb-3">
          <label for="description" class="form-label">Описание модуля</label>
          <input type="text" th:field="*{moduleDescription}" class="form-control" id="description" required>
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <div class="text-center mt-4">
    <a href="/main/modules" class="btn btn-primary">К списку модулей</a>
    <a href="/index" class="btn btn-primary">На главную</a>
  </div>
</div>

<footer th:replace="index::footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
</body>
</html>
