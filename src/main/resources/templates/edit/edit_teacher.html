<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Информационно-справочная система онлайн-школы</title>
    <header th:replace="index::head"></header>
</head>

<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Информационно-справочная система онлайн-школы</h1>
    <h2 class="text-center mb-4">Преподаватели</h2>

    <div th:replace="index::navbar"></div>

    <div class="row">
        <div class="col-md-8 offset-md-2">
            <form th:action="@{/save/save_teacher}" th:object="${teacher}" method="post" class="card p-4">
                <h3 class="mb-4">Редактировать преподавателя</h3>
                <div class="mb-3">
                    <label for="id" class="form-label">ID преподавателя</label>
                    <input type="number" th:field="*{id}" class="form-control" id="id" readonly="readonly" required>
                </div>
                <div class="mb-3">
                    <label for="lastName" class="form-label">Фамилия преподавателя</label>
                    <input type="text" th:field="*{lastName}" class="form-control" id="lastName" required>
                </div>
                <div class="mb-3">
                    <label for="firstName" class="form-label">Имя преподавателя</label>
                    <input type="text" th:field="*{firstName}" class="form-control" id="firstName" required>
                </div>
                <div class="mb-3">
                    <label for="surname" class="form-label">Отчество преподавателя</label>
                    <input type="text" th:field="*{surname}" class="form-control" id="surname">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Почта преподавателя</label>
                    <input type="email" th:field="*{email}" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Телефон преподавателя</label>
                    <input type="text" th:field="*{phone}" class="form-control" id="phone">
                </div>
                <div class="mb-3">
                    <label for="specialization" class="form-label">Специализация</label>
                    <input type="text" th:field="*{specialization}" class="form-control" id="specialization">
                </div>
                <div class="mb-3">
                    <label for="experience" class="form-label">Опыт работы (в годах)</label>
                    <input type="number" th:field="*{experience}" class="form-control" id="experience">
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/main/teachers" class="btn btn-primary">К списку преподавателей</a>
        <a href="/index" class="btn btn-primary">На главную</a>
    </div>
</div>

<footer th:replace="index::footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
</body>
</html>
