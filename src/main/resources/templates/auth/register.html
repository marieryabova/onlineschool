<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/main.css}">
</head>

<body>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Регистрация</h2>

          <form th:action="@{/auth/register}" method="post" th:object="${registerRequest}">
            <!-- Основные поля -->
            <div class="mb-3">
              <label for="username" class="form-label">Логин</label>
              <input type="text" class="form-control" id="username"
                     th:field="*{username}" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Пароль</label>
              <input type="password" class="form-control" id="password"
                     th:field="*{password}" required>
            </div>

            <div class="mb-3">
              <label for="role" class="form-label">Роль</label>
              <select class="form-select" id="role" th:field="*{role}"
                      onchange="toggleRoleFields()" required>
                <option value="">Выберите роль</option>
                <option value="STUDENT">Ученик</option>
                <option value="TEACHER">Преподаватель</option>
              </select>
            </div>

            <!-- Поля студента (изначально скрыты) -->
            <div id="studentFields" style="display: none;">
              <div class="mb-3">
                <label for="firstName" class="form-label">Имя</label>
                <input type="text" class="form-control" id="firstName"
                       th:field="*{firstName}" placeholder="Введите имя">
              </div>

              <div class="mb-3">
                <label for="lastName" class="form-label">Фамилия</label>
                <input type="text" class="form-control" id="lastName"
                       th:field="*{lastName}" placeholder="Введите фамилию">
              </div>

              <div class="mb-3">
                <label for="lastName" class="form-label">Отчество</label>
                <input type="text" class="form-control" id="surname"
                       th:field="*{surname}" placeholder="Введите Отчество">
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email"
                       th:field="*{email}" placeholder="example@mail.com">
              </div>

              <div class="mb-3">
                <label for="phone" class="form-label">Телефон</label>
                <input type="tel" class="form-control" id="phone"
                       th:field="*{phone}" placeholder="+7 (XXX) XXX-XX-XX">
              </div>
            </div>

            <!-- Поля преподавателя (изначально скрыты) -->
            <div id="teacherFields" style="display: none;">
              <h5 class="mb-3 border-bottom pb-2">Данные преподавателя</h5>
              <div class="mb-3">
                <label for="teacherFirstName" class="form-label">Имя</label>
                <input type="text" class="form-control" id="teacherFirstName"
                       th:field="*{teacherFirstName}" placeholder="Введите имя">
              </div>

              <div class="mb-3">
                <label for="teacherLastName" class="form-label">Фамилия</label>
                <input type="text" class="form-control" id="teacherLastName"
                       th:field="*{teacherLastName}" placeholder="Введите фамилию">
              </div>

              <div class="mb-3">
                <label for="teacherSurname" class="form-label">Отчество</label>
                <input type="text" class="form-control" id="teacherSurname"
                       th:field="*{teacherSurname}" placeholder="Введите отчество">
              </div>

              <div class="mb-3">
                <label for="teacherEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="teacherEmail"
                       th:field="*{teacherEmail}" placeholder="example@mail.com">
              </div>

              <div class="mb-3">
                <label for="teacherPhone" class="form-label">Телефон</label>
                <input type="tel" class="form-control" id="teacherPhone"
                       th:field="*{teacherPhone}" placeholder="+7 (XXX) XXX-XX-XX">
              </div>

              <div class="mb-3">
                <label for="specialization" class="form-label">Специализация</label>
                <input type="text" class="form-control" id="specialization"
                       th:field="*{specialization}" placeholder="Математика, Физика и т.д.">
              </div>

              <div class="mb-3">
                <label for="experience" class="form-label">Опыт работы (лет)</label>
                <input type="number" class="form-control" id="experience"
                       th:field="*{experience}" min="0" placeholder="5">
              </div>
            </div>

            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            </div>

            <div th:if="${errors}" class="alert alert-danger mt-3">
              <ul class="mb-0">
                <li th:each="err : ${errors}" th:text="${err.defaultMessage}"></li>
              </ul>
            </div>
          </form>

          <div class="mt-3 text-center">
            <p>Уже есть аккаунт? <a th:href="@{/auth/login}">Войти в систему</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>

<script>
  function toggleRoleFields() {
    const role = document.getElementById('role').value;
    const studentFields = document.getElementById('studentFields');
    const teacherFields = document.getElementById('teacherFields');

    // Скрываем все поля сначала
    studentFields.style.display = 'none';
    teacherFields.style.display = 'none';

    // Убираем обязательность всех полей
    document.querySelectorAll('#studentFields input, #teacherFields input').forEach(input => {
      input.required = false;
    });

    // Показываем нужные поля и делаем их обязательными
    if (role === 'STUDENT') {
      studentFields.style.display = 'block';
      document.querySelectorAll('#studentFields input').forEach(input => {
        input.required = true;
      });
    } else if (role === 'TEACHER') {
      teacherFields.style.display = 'block';
      document.querySelectorAll('#teacherFields input').forEach(input => {
        input.required = true;
      });
    }
  }

  // Инициализация при загрузке страницы
  document.addEventListener('DOMContentLoaded', function() {
    toggleRoleFields(); // Вызываем для установки начального состояния
  });
</script>
</body>
</html>
