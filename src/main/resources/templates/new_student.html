<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Информационно-справочная система онлайн-школы</title>
    <header th:replace="index::head"></header>
</head>

<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">Информационно-справочная система онлайн-школы</h1>
    <h2 class="text-center mb-4">Ученики</h2>

    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container-fluid">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link btn btn-light me-2" href="/">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-light me-2" href="/about">Об авторе</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-light me-2" href="/students">Ученики</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-light me-2" href="/teachers">Преподаватели</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-light me-2" href="/courses">Курсы</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="row">
        <div class="col-md-8 offset-md-2">
            <form th:action="@{/save_student}" th:object="${student}" method="post" class="card p-4">
                <h3 class="mb-4">Добавление нового ученика</h3>
                <div class="mb-3">
                    <label for="lastName" class="form-label">Фамилия ученика</label>
                    <input type="text" th:field="*{lastName}" class="form-control" id="lastName" required>
                </div>
                <div class="mb-3">
                    <label for="firstName" class="form-label">Имя ученика</label>
                    <input type="text" th:field="*{firstName}" class="form-control" id="firstName" required>
                </div>
                <div class="mb-3">
                    <label for="surname" class="form-label">Отчество ученика</label>
                    <input type="text" th:field="*{surname}" class="form-control" id="surname">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Почта ученика</label>
                    <input type="email" th:field="*{email}" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Телефон ученика</label>
                    <input type="text" th:field="*{phone}" class="form-control" id="phone">
                </div>
                <div class="mb-3">
                    <label for="courseNumber" class="form-label">Количество курсов</label>
                    <input type="number" th:field="*{courseNumber}" class="form-control" id="courseNumber">
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-primary">Назад</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
</body>
</html>
