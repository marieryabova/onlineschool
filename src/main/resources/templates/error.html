<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
    <header th:replace="index::head"></header>
</head>
<body>
    <div class="container-fluid vh-100 d-flex justify-content-center align-items-center p-4">
        <div class="bg-white p-5 rounded-3 shadow-sm text-center" style="max-width: 600px;">
            <div class="text-danger mb-4">
                <i class="bi bi-exclamation-triangle-fill" style="font-size: 3rem;"></i>
            </div>
            <h1 class="text-danger mb-4">Ошибка</h1>

            <div th:if="${errorMessage}" class="alert alert-danger mb-4" role="alert">
                <h4 class="alert-heading">Что-то пошло не так!</h4>
                <hr>
                <p class="mb-0" th:text="${errorMessage}"></p>
            </div>

            <div th:unless="${errorMessage}" class="alert alert-warning mb-4" role="alert">
                <p class="mb-0">Произошла непредвиденная ошибка</p>
            </div>

            <div class="d-grid gap-3">
                <a href="/index" class="btn btn-primary btn-lg">
                    <i class="bi bi-house-door"></i> Вернуться на главную
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary btn-lg">
                    <i class="bi bi-arrow-left"></i> Назад
                </button>
            </div>
        </div>
    </div>
</body>
</html>
