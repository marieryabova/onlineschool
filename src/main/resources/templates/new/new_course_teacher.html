<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Информационно-справочная система онлайн-школы</title>
  <header th:replace="index::head"></header>
</head>

<body>
<div class="container mt-5">
  <h1 class="text-center mb-4">Информационно-справочная система онлайн-школы</h1>
  <h2 class="text-center mb-4">Курсы-Преподаватели</h2>

  <div th:replace="index::navbar"></div>

  <div class="row">
    <div class="col-md-8 offset-md-2">
      <form th:action="@{/save/save_course_teacher}" th:object="${courseTeacher}" method="post" class="card p-4">
        <h3 class="mb-4">Добавление новой записи</h3>
        <div class="mb-3">
          <label for="course" class="form-label">Курс</label>
          <select th:field="*{course.id}" class="form-select" id="course" required>
            <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.title}"></option>
          </select>
        </div>
        <div class="mb-3">
          <label for="teacher" class="form-label">Преподаватель</label>
          <select th:field="*{teacher.id}" class="form-select" id="teacher" required>
            <option th:each="teacher : ${teachers}" th:value="${teacher.id}" th:text="${teacher.firstName
            + ' ' + teacher.lastName}"></option>
          </select>
        </div>
        <div class="mb-3">
          <label for="role" class="form-label">Роль преподавателя</label>
          <input type="text" th:field="*{role}" class="form-control" id="role" required>
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <div class="text-center mt-4">
    <a href="/main/course_teachers" class="btn btn-primary">К списку записей</a>
    <a href="/index" class="btn btn-primary">На главную</a>
  </div>
</div>

<footer th:replace="index::footer"></footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
