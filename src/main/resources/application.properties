# Application name
spring.application.name=onlineschool

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/onlineschooldb
spring.datasource.username=root
spring.datasource.password=root

# Hibernate dialect for MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Hibernate DDL auto mode
spring.jpa.hibernate.ddl-auto=update

# SQL query logging
logging.level.org.hibernate.SQL=DEBUG

# Hibernate type logging
logging.level.org.hibernate.TYPE=DEBUG


# Cache configuration
spring.cache.type=none

# Static resources handling
spring.web.resources.add-mappings=true

# Server port
server.port=8585

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# MVC path matching strategy
spring.mvc.pathmatch.matching-strategy=ant_path_matcher